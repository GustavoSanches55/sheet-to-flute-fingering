<svg xmlns="http://www.w3.org/2000/svg" class="score" width="790" height="175" viewBox="0 0 790 175" font-family="Segoe UI, Arial, sans-serif" font-size="11.5"><rect width="100%" height="100%" fill="#fff"/>
  <path d="M 91.38 37.0 L 91.5 23.75 A 4.75 4.75 0 1 0 87.88 28.36 L 89.5 37.25 Z" fill="#111" stroke="#111" stroke-width="1.3" stroke-linejoin="round"><title>Left thumb (B key)</title></path><circle cx="100.0" cy="15.5" r="6.125" fill="#111" stroke="#111" stroke-width="1.3" stroke-linejoin="round"><title>Left hand – finger 1</title></circle><circle cx="100.0" cy="35.5" r="6.125" fill="#111" stroke="#111" stroke-width="1.3" stroke-linejoin="round"><title>Left hand – finger 2</title></circle><circle cx="100.0" cy="55.5" r="6.125" fill="#111" stroke="#111" stroke-width="1.3" stroke-linejoin="round"><title>Left hand – finger 3</title></circle><path d="M 99.75 67.5 L 106.88 67.38 Q 114.38 66.12 117.5 58.38 A 3.875 3.875 0 1 0 110.0 56.75 Q 110.0 63.62 103.12 64.75 L 99.75 65.0 Z" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"><title>G♯ key (left pinky)</title></path><line x1="92.5" y1="73.0" x2="107.5" y2="73.0" stroke="#444" stroke-width="1.625"/><circle cx="100.0" cy="90.5" r="6.125" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"><title>Right hand – finger 1</title></circle><circle cx="100.0" cy="110.5" r="6.125" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"><title>Right hand – finger 2</title></circle><circle cx="100.0" cy="130.5" r="6.125" fill="#111" stroke="#111" stroke-width="1.3" stroke-linejoin="round"><title>Right hand – finger 3</title></circle><path d="M 91.0 150.5 L 107.0 150.5 Q 108.25 147.5 104.0 146.88 Q 100.5 146.38 98.0 143.5 Q 95.5 141.12 92.25 142.38 Q 89.75 144.25 91.0 150.5 Z" fill="#111" stroke="#111" stroke-width="1.3" stroke-linejoin="round"><title>E♭ key (right pinky)</title></path><path d="M 96.25 153.62 A 5.25 5.25 0 0 0 96.25 164.12 Z" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"><title>C♯ key (foot)</title></path><rect x="98.25" y="153.62" width="2.5" height="10.5" fill="#fff" stroke="#111" stroke-width="1" stroke-linejoin="round"><title>C key (foot, roller)</title></rect><rect x="102.38" y="153.62" width="2.5" height="10.5" fill="#fff" stroke="#111" stroke-width="1" stroke-linejoin="round"><title>B key (foot, roller)</title></rect><rect x="106.5" y="153.62" width="2.5" height="10.5" fill="#fff" stroke="#111" stroke-width="1" stroke-linejoin="round"><title>Gizmo key (high C) (foot, roller)</title></rect>
  <g fill="#333">
    <text x="72" y="29" text-anchor="end">thumb →</text>
    <text x="126" y="19.5">← left hand finger 1 (index)</text>
    <text x="126" y="39.5">← finger 2 (middle)</text>
    <text x="126" y="59.5">← finger 3 (ring)</text>
    <text x="126" y="76">  ↳ curved lever = G♯ key (left pinky), shown only when used</text>
    <text x="126" y="94.5">← right hand finger 1</text>
    <text x="126" y="114.5">← finger 2</text>
    <text x="126" y="134.5">← finger 3</text>
    <text x="126" y="152">← “shoe” = E♭ key (right pinky)</text>
    <text x="126" y="168">← foot keys: half-disc = C♯, bars = C / B (low notes only)</text>
  </g>
  <g fill="#333" font-size="12">
    <text x="590" y="100">● black = press / cover</text>
    <text x="590" y="118">○ white = leave open</text>
    <text x="590" y="136" fill="#d62728">● red = changed from</text>
    <text x="590" y="152" fill="#d62728">   the previous note</text>
  </g>
</svg>